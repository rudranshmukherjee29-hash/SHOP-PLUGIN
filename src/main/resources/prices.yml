# ============================================================================
# ShopPlugin prices.yml
# ============================================================================
# This file defines the full curated vanilla item catalog and its default
# balanced prices. See README.md ("Economy Balancing") for the full
# reasoning behind these numbers. Short version of the rules used:
#
#   - sell-price is ALWAYS well below buy-price (never enough margin for a
#     direct buy->sell profit).
#   - Where an item can be crafted, smelted, compressed, or decompressed
#     into/from another shop item, prices are set so doing that conversion
#     and selling the result is not profitable in either direction.
#   - Common/renewable items are cheap; rare, dangerous, or
#     progression-gating items are expensive and, in a few cases,
#     intentionally not purchasable at all (only sellable, or excluded
#     from the shop entirely) to protect progression.
#
# Run `/shopadmin validateprices` after editing this file to check for
# accidental arbitrage loops before reloading on a live server.
#
# Fields per item:
#   material:               Bukkit Material enum name (required)
#   category:                One of the ShopCategory values (required)
#   buy-price:               Omit or remove to disable buying
#   sell-price:              Omit or remove to disable selling
#   max-transaction-size:    Per-item cap on a single buy/sell (default 6400)
#   limited-stock:           true/false (default false = unlimited)
#   max-stock:               Only used if limited-stock: true
#   restock-amount:          Amount restocked per interval (limited-stock only)
#   restock-interval-seconds:
#   per-player-daily-limit:  -1 = unlimited
#   display-name:            Optional MiniMessage override for GUI display
# ============================================================================

