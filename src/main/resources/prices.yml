# presence in a routine buy/sell shop would either trivialize a boss fight
# reward or create an attention-sink "sell your one totem" edge case that
# doesn't fit a curated survival economy. Server owners who want to include
# them can add entries following the same format above, but should think
# carefully about buy-price (if any) before doing so.
